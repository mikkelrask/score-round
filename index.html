<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#16130f">
<title>Scorecard — Boxing Round Scoring</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='10' fill='%2316130f'/><text x='32' y='45' font-family='Arial Black,Impact' font-size='34' font-weight='900' text-anchor='middle' fill='%23d9ab4f'>10</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute;pointer-events:none">
  <defs>
    <filter id="portrait-red" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values=".2126 .7152 .0722 0 0 .2126 .7152 .0722 0 0 .2126 .7152 .0722 0 0 0 0 0 1 0"/>
      <feComponentTransfer>
        <feFuncR type="table" tableValues=".169 .635 1"/>
        <feFuncG type="table" tableValues=".063 .231 .835"/>
        <feFuncB type="table" tableValues=".106 .302 .812"/>
      </feComponentTransfer>
    </filter>
    <filter id="portrait-blue" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values=".2126 .7152 .0722 0 0 .2126 .7152 .0722 0 0 .2126 .7152 .0722 0 0 0 0 0 1 0"/>
      <feComponentTransfer>
        <feFuncR type="table" tableValues=".051 .184 .796"/>
        <feFuncG type="table" tableValues=".118 .467 .906"/>
        <feFuncB type="table" tableValues=".220 .694 1"/>
      </feComponentTransfer>
    </filter>
    <filter id="portrait-gold" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values=".2126 .7152 .0722 0 0 .2126 .7152 .0722 0 0 .2126 .7152 .0722 0 0 0 0 0 1 0"/>
      <feComponentTransfer>
        <feFuncR type="table" tableValues=".125 .588 1"/>
        <feFuncG type="table" tableValues=".094 .443 .929"/>
        <feFuncB type="table" tableValues=".047 .208 .729"/>
      </feComponentTransfer>
    </filter>
  </defs>
</svg>
<header class="topbar no-print">
  <div class="brand">
    <span class="brand-mark">10</span>
    <span class="brand-name">SCORECARD</span>
  </div>
  <nav class="topnav">
    <button class="btn btn-ghost" data-action="sync-retry" id="sync-status" aria-live="polite">Connecting…</button>
    <span id="account-email" class="account-email"></span>
    <a class="btn btn-ghost" href="/cdn-cgi/access/logout">Sign out</a>
    <button class="btn btn-ghost" data-action="history-open">History</button>
    <button class="btn btn-ghost" data-action="stats-open">My stats</button>
    <button class="btn btn-ghost" data-action="leaderboard-open">Leaderboard</button>
    <button class="btn btn-ghost" id="nav-new-bout" data-action="new-bout" hidden>New bout</button>
  </nav>
</header>
<main id="app"></main>
<div id="overlays"></div>
<div id="printout" class="print-area"></div>
<input type="file" id="history-file" accept="application/json,.json" hidden>
<script type="module" src="app.js"></script>
</body>
</html>
